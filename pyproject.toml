[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-creator-agent"
version = "0.1.0"
description = "MCP server that turns a topic into an edited video package for Facebook Page publishing, with explicit-approval publishing guard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Facebook Creator Agent contributors" }]
dependencies = [
  "mcp>=2.3.0,<3",
  "pydantic>=2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
facebook-creator-mcp = "facebook_creator_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
